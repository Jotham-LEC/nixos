name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - run: nix fmt -- --ci

      # Eval, not `nix flake check`: checks.x1c builds the whole system, and
      # emacs-pgtk-with-doom is built from this repo's doom/, so no cache can
      # ever hold it. Eval still does the IFD that doomdir needs.
      - run: nix eval --raw .#nixosConfigurations.x1c.config.system.build.toplevel.drvPath
